# ============================================================
# React·Vite 쓰레기 CNN 웹앱 GitHub Pages 자동 배포
# ============================================================

name: Deploy garbage classifier to GitHub Pages


# ------------------------------------------------------------
# 1. 워크플로 실행 조건
# ------------------------------------------------------------
# main 브랜치에 Push할 때 자동으로 실행합니다.
# GitHub Actions 화면에서 수동 실행도 가능합니다.

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ------------------------------------------------------------
# 2. GitHub Pages 배포 권한
# ------------------------------------------------------------

permissions:
  contents: read
  pages: write
  id-token: write


# ------------------------------------------------------------
# 3. 중복 배포 방지
# ------------------------------------------------------------

concurrency:
  group: pages
  cancel-in-progress: true


# ------------------------------------------------------------
# 4. 배포 작업
# ------------------------------------------------------------

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # 4-1. GitHub 저장소의 코드를 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v7

      # 4-2. Node.js LTS 버전을 설치합니다.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      # 4-3. package-lock.json을 기준으로 패키지를 설치합니다.
      - name: Install dependencies
        run: npm ci

      # 4-4. React·Vite 프로젝트를 dist 폴더로 빌드합니다.
      - name: Build React Vite project
        run: npm run build

      # 4-5. GitHub Pages 배포 환경을 준비합니다.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      # 4-6. dist 폴더를 배포 파일로 업로드합니다.
      - name: Upload build files
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      # 4-7. 업로드한 파일을 GitHub Pages에 배포합니다.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5